<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L &amp; A</title>
  <style>
    html, body { height: 100%; margin: 0; background: #FAF8F5; font-family: Georgia, serif; }
    .wrap { display: flex; align-items: center; justify-content: center; height: 100%; color: #8C6B69; }
  </style>
  <script>
    // Kill the old service worker and all its caches, then send everyone to the clean app path.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {}
      location.replace('/wedding-day/app/');
    })();
  </script>
</head>
<body>
  <div class="wrap">Opening your checklist…</div>
</body>
</html>
